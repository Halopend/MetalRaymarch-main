}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;space-transformations-explorer&quot;&gt;
  &lt;style&gt;

  &lt;div class=&quot;viz-row warp-flow&quot; aria-label=&quot;Domain transformation pipeline&quot;&gt;

        &lt;optgroup label=&quot;Mirrors &amp;amp; folds&quot;&gt;
          &lt;option value=&quot;mirror&quot;&gt;Mirror Fold&lt;/option&gt;

          &lt;option value=&quot;planeFold&quot;&gt;Plane Fold&lt;/option&gt;
          &lt;option value=&quot;kaleidoscope&quot;&gt;Kaleidoscope&lt;/option&gt;
          &lt;option value=&quot;mengerFold&quot;&gt;Menger Fold&lt;/option&gt;
          &lt;option value=&quot;offsetFold&quot;&gt;Offset Fold&lt;/option&gt;
        &lt;/optgroup&gt;
        &lt;optgroup label=&quot;Space cutting&quot;&gt;
          &lt;option value=&quot;coxeter&quot;&gt;Coxeter&lt;/option&gt;
          &lt;option value=&quot;icosahedralCut&quot;&gt;Icosahedral Space Cut&lt;/option&gt;
        &lt;/optgroup&gt;
        &lt;optgroup label=&quot;Spherical &amp;amp; radial&quot;&gt;
          &lt;option value=&quot;sphereFold&quot;&gt;Sphere Fold&lt;/option&gt;
          &lt;option value=&quot;inversion&quot;&gt;Sphere Inversion&lt;/option&gt;
          &lt;option value=&quot;tubeFold&quot;&gt;Tube Fold&lt;/option&gt;
          &lt;option value=&quot;shells&quot;&gt;Shells&lt;/option&gt;
          &lt;option value=&quot;compressionShells&quot;&gt;Compression Shells&lt;/option&gt;
        &lt;/optgroup&gt;
        &lt;optgroup label=&quot;Self-similar repeats&quot;&gt;
          &lt;option value=&quot;scaleRepeat&quot;&gt;Scale Repeat&lt;/option&gt;
          &lt;option value=&quot;tiling&quot;&gt;Tiling&lt;/option&gt;
          &lt;option value=&quot;scale&quot;&gt;Scale&lt;/option&gt;
          &lt;option value=&quot;mandelboxStep&quot;&gt;Mandelbox Step&lt;/option&gt;
        &lt;/optgroup&gt;
        &lt;optgroup label=&quot;Bend &amp;amp; wave&quot;&gt;
          &lt;option value=&quot;twist&quot; selected&gt;Twist&lt;/option&gt;

    &lt;label class=&quot;form-label&quot; for=&quot;stx-strength&quot;&gt;
      &lt;span id=&quot;stx-strength-label&quot;&gt;Twist&lt;/span&gt;
      &lt;span id=&quot;stx-strength-value&quot;&gt;0.60&lt;/span&gt;

    &lt;/label&gt;

    &lt;label class=&quot;form-label&quot; for=&quot;stx-p1&quot; id=&quot;stx-p1-wrap&quot;&gt;
      &lt;span id=&quot;stx-p1-label&quot;&gt;Parameter 1&lt;/span&gt;

  &lt;/div&gt;

  &lt;div class=&quot;viz-controls&quot;&gt;

    &lt;/div&gt;
    &lt;div class=&quot;form-check form-switch&quot;&gt;
      &lt;input class=&quot;form-check-input&quot; id=&quot;stx-show-axes&quot; type=&quot;checkbox&quot; checked&gt;
      &lt;label class=&quot;form-check-label&quot; for=&quot;stx-show-axes&quot;&gt;Coordinate axes&lt;/label&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;svg class=&quot;warp-stage&quot; id=&quot;stx-stage&quot; viewBox=&quot;0 0 736 390&quot; role=&quot;img&quot; aria-labelledby=&quot;stx-svg-title stx-svg-desc&quot;&gt;
    &lt;title id=&quot;stx-svg-title&quot;&gt;Interactive three-dimensional domain transformation&lt;/title&gt;
    &lt;desc id=&quot;stx-svg-desc&quot;&gt;The optional neutral overlay is the original coordinate cage. Colored lines show the transformed cage: X-directed lines use the first series color, Y-directed lines the second, and Z-directed lines the third.&lt;/desc&gt;
    &lt;g id=&quot;stx-original&quot;&gt;&lt;/g&gt;
    &lt;g id=&quot;stx-result&quot;&gt;&lt;/g&gt;
    &lt;g id=&quot;stx-axes&quot;&gt;&lt;/g&gt;
    &lt;text class=&quot;warp-caption text-small&quot; x=&quot;18&quot; y=&quot;374&quot; id=&quot;stx-overlay-label&quot;&gt;neutral: input-grid overlay&lt;/text&gt;
    &lt;text class=&quot;warp-label text-small&quot; x=&quot;664&quot; y=&quot;40&quot;&gt;X&lt;/text&gt;
    &lt;text class=&quot;warp-label text-small&quot; x=&quot;371&quot; y=&quot;28&quot;&gt;Y&lt;/text&gt;
    &lt;text class=&quot;warp-label text-small&quot; x=&quot;91&quot; y=&quot;96&quot;&gt;Z&lt;/text&gt;
  &lt;/svg&gt;

  &lt;div class=&quot;text-small text-muted&quot; id=&quot;stx-live&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

        &lt;tr&gt;

  &lt;/div&gt;

  &lt;div class=&quot;text-small text-muted&quot;&gt;
    Stack order is left-to-right: a later transformation receives the coordinates produced by every earlier one. Because the point domain is transformed, scaling the coordinates up makes the visible object appear smaller.

      const clamp = (x, a, b) =&gt; Math.max(a, Math.min(b, x));

        const v1 = Number(p1.value || 0);

        const t = clamp(s, 0, 1);

        if (kind === &quot;twist&quot;) return s &lt;= 0 ? p : rodrigues(p, a, s * dot(p, a) * 1.5);

    const trigger = getTrigger(event.target);

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
